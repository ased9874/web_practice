<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript 명령문</title>
</head>
<script>
    let number = prompt("정수를 입력하세요");
    if (number % 2 == 0) {
        alert('짝수입니다.');
    }
    else {
        alert('홀수입니다.');
    }
</script>
<body>
    <h1>조건문</h1>
</body>
</html>
