<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테이블 태그</title>
</head>
<body>
    <h1>표 만들기</h1>
    <table border = '1'> <!--제거된 속성임-->
        <thead>
            <tr>
                <th>제목1</th>
                <th>제목2</th>
                <th>제목3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan ='2'>내용11</td>
                <td>내용12</td>
                <td>내용13</td>
            </tr>
            <tr>
                <!-- 행 합치기를 할 때 병합된 셀도 지워야 함 <td>내용21</td> -->
                <td>내용22 이므가니 </td>
                <td>내용23</td>
            </tr>
            <tr>
                <td colspan = '3'>내용31</td>
                <!-- 나머진 주석처리
                <td>내용32</td>
                <td>내용33</td>
                -->
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>꼬리1</td>
                <td>꼬리2</td>
                <td>꼬리3</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
